version: "3.9"

services:
  envios_db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: sistema_envios
    volumes:
      - ./db_data:/var/lib/postgresql/data
    networks:
      - red_db
    expose:
      - "5432"

  ldap:
    image: osixia/openldap:1.5.0
    container_name: ldap-envios
    hostname: ldap-envios
    environment:
      LDAP_ORGANISATION: "envios"
      LDAP_DOMAIN: "envios.local"
    volumes:
      - ./ldap/ldif:/container/service/slapd/assets/config/bootstrap/ldif
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    networks:
      - red_ldap



  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile.dev
    ports:
      - "80:80"
    networks:
      - red_publica
      - red_apps
    depends_on:
      - servidor
      - ldap

  servidor:
    build:
      context: ./servidor/backend
      dockerfile: Dockerfile.dev
    networks:
      - red_apps
      - red_db
      - red_ldap
    depends_on:
      - envios_db
      - ldap

  mostrador:
    build:
      context: ./mostrador
      dockerfile: Dockerfile.dev
    tty: true
    stdin_open: true
    networks:
      - red_publica
      - red_ldap
    depends_on:
      - ldap

networks:
  red_apps:
  red_db:
  red_publica:
  red_ldap:

volumes:
  ldap_data:
  ldap_config:
