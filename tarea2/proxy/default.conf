# Servidor público para frontend expuesto a internet
server {
    listen 80;
    server_name envios.com;

    # Redirigir peticiones de /api/ al servidor backend
    location /api/ {
        proxy_pass http://servidor:5000/api/;  # Redirige a la aplicación backend
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # También aceptar /app/ por HTTP dentro de la red Docker (clientes internos)
    location /app/ {
        proxy_pass http://servidor:5000/app/;  # Redirige a la aplicación backend
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend React (opcional)
    # location / {
    #     proxy_pass http://mostrador:5173;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}

# Servidor interno para clientes dentro de Docker (HTTPS con certificados autofirmados)
server {
    listen 443 ssl;
    server_name empleados.local;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Redirigir peticiones de /app/ al servidor backend
    location /app/ {
        proxy_pass http://servidor:5000/app/;  # Redirige a la aplicación backend
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rutas auxiliares para clientes internos
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}